# Full-stack Docker Compose for StudRide (D-003, D-012, D-021).
# - `docker compose up --build` starts MySQL 8 (`db`) + the single-image Express API & React SPA (`app`) on http://localhost:${PORT:-3001}.
# - `docker compose up db` starts only MySQL 8 for host-based `npm run dev`.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-studride-root-local}
      MYSQL_DATABASE: ${DB_NAME:-studride}
      MYSQL_USER: ${DB_USER:-studride}
      MYSQL_PASSWORD: ${DB_PASSWORD:-studride-local}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-studride}
      DB_USER: ${DB_USER:-studride}
      DB_PASSWORD: ${DB_PASSWORD:-studride-local}
      JWT_SECRET: ${JWT_SECRET:-studride-compose-jwt-secret-at-least-32-bytes}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-studride-admin-local}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-studride-moderator-local}
      FRONTEND_DIST_DIR: /app/frontend/dist
      TRUST_PROXY: ${TRUST_PROXY:-false}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      EXTRA_UNIVERSITY_DOMAINS: ${EXTRA_UNIVERSITY_DOMAINS:-}
    ports:
      - "${PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
